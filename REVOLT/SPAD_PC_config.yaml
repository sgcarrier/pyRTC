##############################################################
# Config file for the "SPAD PC"
# Hardware includes: - ANdor Ixion Camera
#                    - C Red Camera
#                    - SPAD Camera
#
# This PC will read the signal from the PWFS, compute the DM commands and sends them to the main RTC PC that 
# runs another instance of pyRTC
##############################################################

loop:
  gain: 0.1
  numDroppedModes: 0
  pokeAmp: 0.01 #
  numItersIM: 5
  #IMFile: "andor_IM_24sept2025.npy"
  affinity: 2
  method: push-pull
  functions:
  - leakyIntegrator


trloop:
  gain: 0.1
  numDroppedModes: 0
  pokeAmp: 0.01 #
  numItersIM: 50
  #pushPullFile: "res/IM_testing_20nov2025.pickle"
  pushPullFile: "res/IM_high_speed_20nov2025_night.pickle"
  #REFFile:''
  affinity: 2
  method: push-pull
  functions:
  - timeResolvedIntegratorWithLeak_C


trwfs:
  name: MPD_SPAD
  idx: 0
  binning: 1
  exposure: 100 # in 10ns
  nFrames: 48
  nIntegFrames: 1
  width: 32  
  height: 64 
  darkCount: 1000
  darkFile: "res/lab_latest_dark.npy"
  affinity: 3
  functions:
  - expose

wfs:
  name: ANDOR_IXON
  idx: 0
  binning: 1 
  exposure: 0.0625
  width: 128 
  height: 128
  darkCount: 1000
  darkFile: "res/andor_dark.npy"
  affinity: 3
  functions:
  - expose


#TODO  adjust the pupils here for REVOLT
slopes:
  type: PYWFS
  signalType: full_frame
  affinity: 4
  flatNorm: True
  binning: 1
  #Specify where the pupils are and how large for a PYWFS
  pupilsRadius: 29 #5 #17 #17 #4 #9 #15 #17 # 9
  pupils:
  - 30, 32 #5,5 #22,20 #5,5 #10,11 #11,11  #21,23 #22,20 # 21,22   11,11
  - 98,32 #26,5 #108,20 #26,5 #53,11 #53, 11 #107,23 #107,20 #  106,22 53,10
  - 29,98 #5,26 #21,105 #5,26 #10,54 #10, 53 #20,108 #22,105 # 21,107 11,53
  - 98,98 #26,26 #107,106 #26,27 #53,54 #53, 54 #107,109 #107,106 # 106,107 54,53
  functions:
  - computeSignal



